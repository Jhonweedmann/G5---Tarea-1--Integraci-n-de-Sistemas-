services:
  cupos:
    build:
      context: .
      dockerfile: cupos/Dockerfile
    environment:
      CUPOS_DB: /data/cupos.db
    volumes:
      - cupos_data:/data
    # Sin "ports": Cupos solo es alcanzable dentro de la red de Compose.

  matriculas:
    build:
      context: .
      dockerfile: matriculas/Dockerfile
    environment:
      MATRICULAS_DB: /data/matriculas.db
      CUPOS_GRPC_TARGET: cupos:50051
      GRPC_TIMEOUT_SECONDS: "2"
      API_TOKEN: desarrollo-seguro
      API_TOKEN_LECTURA: solo-lectura
      CACHE_TTL_SECONDS: "30"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - matriculas_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - cupos
      - redis

  redis:
    image: redis:7-alpine

  cupos-node-client:
    build:
      context: .
      dockerfile: clients/node-grpc-client/Dockerfile
    profiles: ["demo"]
    depends_on:
      - cupos

volumes:
  cupos_data:
  matriculas_data:
